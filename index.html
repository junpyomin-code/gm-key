<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3A3A32">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="키 발급">
<title>공무노트 키 발급</title>
<style>
:root{--paper:#F5EFE0;--ink:#2b2b25;--char:#3A3A32;--olive:#6B7A4B;--muted:#7a7262;--line:#d8cfbb;--card:#fffdf8;--red:#b91c1c;--amber:#b45309}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--char);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header b{font-size:16px;flex:1}header button{background:transparent;color:#ddd;border:1px solid #666;border-radius:6px;padding:4px 10px;font-size:12px}
#sync{font-size:12px;color:#ffd54a}
nav{display:flex;gap:6px;padding:10px 12px 0;overflow-x:auto}nav button{flex:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 14px;font-size:14px;color:var(--ink)}
nav button.on{background:var(--olive);border-color:var(--olive);color:#fff;font-weight:700}
main{padding:12px;max-width:760px;margin:0 auto;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
textarea{min-height:86px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{flex:1;min-width:84px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 6px;font:inherit;font-size:14px;color:var(--ink)}
.seg button.on{background:var(--char);color:#fff;border-color:var(--char)}
.btn{display:inline-block;border:none;border-radius:8px;padding:11px 18px;font:inherit;font-weight:700;background:var(--olive);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400}.btn.w{width:100%}.btn.red{background:#fff;color:var(--red);border:1px solid #f3c0c0;font-weight:400}
.btn:disabled{opacity:.55}
.msg{margin-top:10px;font-size:14px;white-space:pre-wrap}.msg.err{color:var(--red)}.msg.ok{color:#166534}
.keybox{font-family:Consolas,monospace;font-size:12px;word-break:break-all;background:#fff;border:1px dashed var(--olive);border-radius:7px;padding:10px;margin-top:8px;user-select:all;-webkit-user-select:all}
.hint{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 11px;font-size:13px;color:var(--ink)}
.chips button.on{background:var(--char);color:#fff;border-color:var(--char)}.chips .n{font-weight:700;margin-left:3px}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:8px;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--char);color:#fff;font-weight:600;padding:8px;text-align:left;white-space:nowrap;user-select:none;z-index:1}
th .a{opacity:.45;font-size:10px;margin-left:3px}th.s .a{opacity:1}
td{padding:8px;border-bottom:1px solid #eee5d2;white-space:nowrap}
td.first,th.first{position:sticky;left:0;z-index:2}td.first{background:#fff;font-weight:700}
tbody tr{cursor:pointer}
.st{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;border:1px solid}
.st.ok{color:#166534;border-color:#bbdcc3;background:#f0faf2}.st.near{color:var(--amber);border-color:#f4d19b;background:#fff8eb}.st.exp{color:var(--red);border-color:#f3c0c0;background:#fff1f1}.st.etc{color:var(--muted);border-color:var(--line);background:#faf7f0}
.tag{font-size:11.5px;color:var(--amber);margin-left:4px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}
.mono{font-family:Consolas,monospace;font-size:13px;word-break:break-all}
.center{max-width:420px;margin:8vh auto}
ol.steps{padding-left:18px;margin:6px 0}ol.steps li{margin:4px 0}
</style></head><body>

  $('#bSc').onclick = async () => { const m = $('#scm'); m.className = 'msg'; m.textContent = '확인 중...'; try { const conf = parseSheet($('#sc').value); const d = await callSheet({ action: 'ping' }, conf); store.set(LS.sheet, conf); m.className = 'msg ok'; m.textContent = `연결했습니다(시트: ${d.sheet}).`; S.rows = null; flush(); } catch (e) { m.className = 'msg err'; m.textContent = e.message; } };
  $('#bFl').onclick = async () => { await flush(); $('#flm').className = S.syncErr ? 'msg err' : 'msg ok'; $('#flm').textContent = S.syncErr || `남은 대기 ${store.get(LS.out, []).length}건`; };
  $('#bEx').onclick = () => { const h = store.get(LS.hist, []); copyText(h.map(r => ['발급일시', '이름', 'PC 번호', '기능', '구분', '만료일', '한도', '사용 키', '기록ID'].map(c => r[c] ?? '').join('\t')).join('\n')); $('#flm').className = 'msg ok'; $('#flm').textContent = `이 휴대폰에서 만든 기록 ${h.length}건을 복사했습니다(엑셀에 붙여 넣으면 칸이 나뉨).`; };
  $('#bNp').onclick = async () => { const p = $('#np').value, m = $('#km'); if (p.length < 8) { m.className = 'msg err'; m.textContent = '8자 이상으로 정하세요.'; return; } await saveSeed(SEED, p); $('#np').value = ''; m.className = 'msg ok'; m.textContent = '앱 비밀번호를 바꿨습니다.'; };
  $('#bDel').onclick = () => { if (!confirm('이 휴대폰에서 서명키를 지울까요? 다시 쓰려면 private_key.pem을 다시 넣어야 합니다.\n(구글 시트 기록과 대표 PC의 서명키는 그대로입니다)')) return; localStorage.removeItem(LS.key); lock(); };
}
boot();
</script></body></html>
